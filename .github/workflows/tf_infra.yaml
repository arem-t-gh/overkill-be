name: Infra

on:
  workflow_dispatch:

jobs:
  # Ungated — read-only, runs whenever this workflow is manually triggered.
  plan:
    uses: ./.github/workflows/_tf.yaml
    with:
      cmd: plan
      environment: plan

  # Gated — the "dev" environment requires reviewer approval (Settings >
  # Environments), same mechanism manage_superuser_cli.yaml already uses.
  apply:
    needs: plan
    uses: ./.github/workflows/_tf.yaml
    with:
      cmd: apply
      environment: dev
