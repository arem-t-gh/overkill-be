name: Ruff

# workflow_call makes this callable as a job by other workflows —
# gcp_build_push_image.yaml runs it as the deploy gate.
on:
  pull_request:
  workflow_call:

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Ruff with pyproject.toml
        uses: astral-sh/ruff-action@v4.0.0
        with:
          version-file: "pyproject.toml"
          args: "--version"

      - name: Run Ruff check
        run: ruff check

      - name: Check Ruff formatting
        if: always()
        run: ruff format --check --diff

